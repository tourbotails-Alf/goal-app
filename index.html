<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Goal App</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #0f172a;
        color: white;
        min-height: 100vh;
    }

    /* ================= LOGIN ================= */

    #loginScreen {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .login-box {
        width: 100%;
        max-width: 420px;
        background: #1e293b;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    .login-box h1 {
        text-align: center;
        margin-bottom: 10px;
    }

    .login-box > p {
        text-align: center;
        color: #94a3b8;
        margin-bottom: 30px;
    }

    .account-choice {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
    }

    .account-choice button {
        flex: 1;
        padding: 15px;
        border: 2px solid #334155;
        background: #0f172a;
        color: white;
        border-radius: 12px;
        cursor: pointer;
        font-size: 16px;
    }

    .account-choice button:hover {
        border-color: #38bdf8;
    }

    .account-choice button.selected {
        background: #0284c7;
        border-color: #38bdf8;
    }

    .input-group {
        margin-bottom: 18px;
    }

    .input-group label {
        display: block;
        margin-bottom: 7px;
        color: #cbd5e1;
    }

    .input-group input,
    .input-group select {
        width: 100%;
        padding: 13px;
        border-radius: 10px;
        border: 1px solid #475569;
        background: #0f172a;
        color: white;
        outline: none;
        font-size: 15px;
    }

    .login-btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #0284c7;
        color: white;
        font-size: 16px;
        cursor: pointer;
        margin-top: 8px;
    }

    .login-btn:hover {
        background: #0369a1;
    }

    .error {
        color: #f87171;
        text-align: center;
        margin-top: 15px;
        min-height: 20px;
    }

    /* ================= APP ================= */

    #app {
        display: none;
        min-height: 100vh;
    }

    header {
        height: 70px;
        background: #1e293b;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 25px;
        border-bottom: 1px solid #334155;
    }

    .logo {
        font-size: 22px;
        font-weight: bold;
    }

    .account-button {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        border: none;
        background: #0284c7;
        color: white;
        font-size: 20px;
        cursor: pointer;
    }

    .account-button:hover {
        background: #0369a1;
    }

    main {
        padding: 35px;
        max-width: 1100px;
        margin: auto;
    }

    .welcome {
        margin-bottom: 25px;
    }

    .welcome h1 {
        font-size: 32px;
        margin-bottom: 8px;
    }

    .welcome p {
        color: #94a3b8;
    }

    /* ================= POINTS ================= */

    .points-box {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 18px;
        padding: 25px;
        margin-bottom: 25px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
    }

    .points-title {
        color: #94a3b8;
        font-size: 14px;
        margin-bottom: 5px;
    }

    .points-number {
        font-size: 38px;
        font-weight: bold;
    }

    .points-star {
        font-size: 45px;
    }

    /* ================= TASK FORM ================= */

    .task-form {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 18px;
        padding: 25px;
        margin-bottom: 30px;
    }

    .task-form h2 {
        margin-bottom: 20px;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 150px 180px;
        gap: 15px;
    }

    .task-form input,
    .task-form select {
        width: 100%;
        padding: 14px;
        border-radius: 10px;
        border: 1px solid #475569;
        background: #0f172a;
        color: white;
        outline: none;
        font-size: 15px;
    }

    .add-task-btn {
        margin-top: 15px;
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #16a34a;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    .add-task-btn:hover {
        background: #15803d;
    }

    /* ================= TASKS ================= */

    .tasks-section {
        margin-top: 20px;
    }

    .tasks-section h2 {
        margin-bottom: 15px;
    }

    .task-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .task-card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 15px;
        padding: 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
    }

    .task-info {
        flex: 1;
    }

    .task-name {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 7px;
    }

    .task-points {
        color: #facc15;
        font-size: 14px;
    }

    .task-child {
        color: #94a3b8;
        font-size: 13px;
        margin-top: 5px;
    }

    .complete-btn {
        padding: 11px 17px;
        border: none;
        border-radius: 9px;
        background: #16a34a;
        color: white;
        cursor: pointer;
        font-size: 14px;
        white-space: nowrap;
    }

    .complete-btn:hover {
        background: #15803d;
    }

    .completed-label {
        color: #4ade80;
        font-weight: bold;
        white-space: nowrap;
    }

    .empty-box {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 15px;
        padding: 35px;
        text-align: center;
        color: #94a3b8;
    }

    .empty-box .empty-icon {
        font-size: 40px;
        margin-bottom: 10px;
    }

    /* ================= SIDEBAR ================= */

    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.55);
        display: none;
        z-index: 90;
    }

    .overlay.show {
        display: block;
    }

    .sidebar {
        position: fixed;
        right: -380px;
        top: 0;
        height: 100vh;
        width: 360px;
        max-width: 90%;
        background: #1e293b;
        z-index: 100;
        padding: 25px;
        box-shadow: -10px 0 30px rgba(0,0,0,0.4);
        transition: right 0.3s ease;
        overflow-y: auto;
    }

    .sidebar.open {
        right: 0;
    }

    .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 30px;
    }

    .sidebar-header h2 {
        font-size: 22px;
    }

    .close-btn {
        background: #334155;
        color: white;
        border: none;
        width: 38px;
        height: 38px;
        border-radius: 10px;
        font-size: 20px;
        cursor: pointer;
    }

    .profile-box {
        background: #0f172a;
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 25px;
        text-align: center;
    }

    .large-avatar {
        width: 65px;
        height: 65px;
        border-radius: 50%;
        background: #0284c7;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 12px;
        font-size: 28px;
    }

    .profile-box h3 {
        margin-bottom: 5px;
    }

    .profile-box p {
        color: #94a3b8;
        font-size: 14px;
    }

    .sidebar-section {
        margin-bottom: 25px;
    }

    .sidebar-section-title {
        color: #94a3b8;
        font-size: 13px;
        text-transform: uppercase;
        margin-bottom: 10px;
        letter-spacing: 1px;
    }

    .switch-account {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px;
        margin-bottom: 10px;
        border: 1px solid #334155;
        background: #0f172a;
        color: white;
        border-radius: 12px;
        cursor: pointer;
        text-align: left;
    }

    .switch-account:hover {
        border-color: #38bdf8;
        background: #162235;
    }

    .switch-account.active {
        border-color: #0284c7;
        background: #082f49;
    }

    .switch-icon {
        width: 40px;
        height: 40px;
        background: #334155;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
    }

    .switch-info {
        flex: 1;
    }

    .switch-info strong {
        display: block;
        margin-bottom: 3px;
    }

    .switch-info span {
        color: #94a3b8;
        font-size: 12px;
    }

    .check {
        color: #38bdf8;
        font-size: 20px;
    }

    .logout-btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #7f1d1d;
        color: white;
        cursor: pointer;
        font-size: 15px;
    }

    .logout-btn:hover {
        background: #991b1b;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 700px) {

        header {
            padding: 0 15px;
        }

        main {
            padding: 25px 15px;
        }

        .welcome h1 {
            font-size: 27px;
        }

        .sidebar {
            width: 330px;
        }

        .login-box {
            padding: 25px;
        }

        .form-row {
            grid-template-columns: 1fr;
        }

        .task-card {
            flex-direction: column;
            align-items: stretch;
        }

        .complete-btn {
            width: 100%;
        }
    }
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<section id="loginScreen">

    <div class="login-box">

        <h1>My Goal App 🎯</h1>

        <p>Choose your account to continue</p>

        <div class="account-choice">

            <button
                id="parentChoice"
                onclick="selectAccount('parent')">
                👨‍👩‍👧 Parent
            </button>

            <button
                id="childChoice"
                onclick="selectAccount('child')">
                🧒 Child
            </button>

        </div>

        <div class="input-group">

            <label>Name</label>

            <input
                id="nameInput"
                type="text"
                placeholder="Enter your name">

        </div>

        <div
            class="input-group"
            id="passwordGroup">

            <label>Password</label>

            <input
                id="passwordInput"
                type="password"
                placeholder="Enter parent password">

        </div>

        <button
            class="login-btn"
            onclick="login()">

            Continue

        </button>

        <div
            class="error"
            id="loginError">
        </div>

    </div>

</section>


<!-- ================= MAIN APP ================= -->

<section id="app">

    <header>

        <div class="logo">
            My Goal App
        </div>

        <button
            class="account-button"
            onclick="openSidebar()">

            👤

        </button>

    </header>


    <main>

        <div class="welcome">

            <h1 id="welcomeTitle">
                Welcome!
            </h1>

            <p id="welcomeText">
                You are logged in.
            </p>

        </div>


        <!-- ================= POINTS ================= -->

        <div
            class="points-box"
            id="pointsBox">

            <div>

                <div class="points-title">
                    My Points
                </div>

                <div
                    class="points-number"
                    id="pointsNumber">

                    0

                </div>

            </div>

            <div class="points-star">
                ⭐
            </div>

        </div>


        <!-- ================= PARENT TASK FORM ================= -->

        <div
            class="task-form"
            id="parentTaskForm">

            <h2>➕ Add a New Task</h2>

            <div class="form-row">

                <input
                    id="taskInput"
                    type="text"
                    placeholder="What should the child do?">

                <input
                    id="pointsInput"
                    type="number"
                    min="1"
                    placeholder="Points">

                <select id="childSelect">
                    <option value="">Choose child</option>
                </select>

            </div>

            <button
                class="add-task-btn"
                onclick="addTask()">

                Add Task

            </button>

            <div
                class="error"
                id="taskError">
            </div>

        </div>


        <!-- ================= TASKS ================= -->

        <div class="tasks-section">

            <h2 id="tasksTitle">
                📋 Tasks
            </h2>

            <div
                class="task-list"
                id="taskList">
            </div>

        </div>

    </main>

</section>


<!-- ================= OVERLAY ================= -->

<div
    class="overlay"
    id="overlay"
    onclick="closeSidebar()">
</div>


<!-- ================= SIDEBAR ================= -->

<aside
    class="sidebar"
    id="sidebar">

    <div class="sidebar-header">

        <h2>Account</h2>

        <button
            class="close-btn"
            onclick="closeSidebar()">
            ×
        </button>

    </div>


    <div class="profile-box">

        <div
            class="large-avatar"
            id="largeAvatar">
            👤
        </div>

        <h3 id="sideName">
            User
        </h3>

        <p id="sideRole">
            Account
        </p>

    </div>


    <div class="sidebar-section">

        <div class="sidebar-section-title">
            Switch account
        </div>


        <button
            class="switch-account"
            id="parentAccountButton"
            onclick="switchAccount('parent')">

            <div class="switch-icon">
                👨‍👩‍👧
            </div>

            <div class="switch-info">

                <strong id="parentName">
                    Parent
                </strong>

                <span>
                    Parent account
                </span>

            </div>

            <div
                class="check"
                id="parentCheck">
                ✓
            </div>

        </button>


        <button
            class="switch-account"
            id="childAccountButton"
            onclick="switchAccount('child')">

            <div class="switch-icon">
                🧒
            </div>

            <div class="switch-info">

                <strong id="childName">
                    Child
                </strong>

                <span>
                    Child account
                </span>

            </div>

            <div
                class="check"
                id="childCheck">
                ✓
            </div>

        </button>

    </div>


    <div class="sidebar-section">

        <div class="sidebar-section-title">
            Account
        </div>

        <button
            class="logout-btn"
            onclick="logout()">

            🚪 Log out

        </button>

    </div>

</aside>


<script>

/* =====================================================
   ACCOUNT DATA
===================================================== */

let accounts =
    JSON.parse(
        localStorage.getItem("familyAccounts")
    ) || {
        parent: null,
        child: null
    };


let currentAccount =
    localStorage.getItem("currentAccount");


let selectedType = "parent";


/* =====================================================
   TASK DATA
===================================================== */

let tasks =
    JSON.parse(
        localStorage.getItem("goalTasks")
    ) || [];


/* =====================================================
   CHILD POINTS
===================================================== */

let childPoints =
    Number(
        localStorage.getItem("childPoints")
    ) || 0;


/* =====================================================
   ACCOUNT SELECTION
===================================================== */

function selectAccount(type) {

    selectedType = type;


    document
        .getElementById("parentChoice")
        .classList.remove("selected");


    document
        .getElementById("childChoice")
        .classList.remove("selected");


    if (type === "parent") {

        document
            .getElementById("parentChoice")
            .classList.add("selected");


        document
            .getElementById("passwordGroup")
            .style.display = "block";

    } else {

        document
            .getElementById("childChoice")
            .classList.add("selected");


        document
            .getElementById("passwordGroup")
            .style.display = "none";


        document
            .getElementById("passwordInput")
            .value = "";
    }
}


/* =====================================================
   LOGIN
===================================================== */

function login() {

    const name =
        document
            .getElementById("nameInput")
            .value
            .trim();


    const password =
        document
            .getElementById("passwordInput")
            .value;


    const error =
        document
            .getElementById("loginError");


    if (!name) {

        error.textContent =
            "Please enter your name.";

        return;
    }


    /* ================= CHILD ================= */

    if (selectedType === "child") {

        if (!accounts.child) {

            accounts.child = {
                name: name
            };

        } else {

            if (
                accounts.child.name !== name
            ) {

                error.textContent =
                    "Incorrect child name.";

                return;
            }
        }
    }


    /* ================= PARENT ================= */

    if (selectedType === "parent") {

        if (!password) {

            error.textContent =
                "Please enter a parent password.";

            return;
        }


        if (!accounts.parent) {

            accounts.parent = {
                name: name,
                password: password
            };

        } else {

            if (
                accounts.parent.name !== name ||
                accounts.parent.password !== password
            ) {

                error.textContent =
                    "Incorrect parent name or password.";

                return;
            }
        }
    }


    localStorage.setItem(
        "familyAccounts",
        JSON.stringify(accounts)
    );


    currentAccount = selectedType;


    localStorage.setItem(
        "currentAccount",
        currentAccount
    );


    error.textContent = "";


    showApp();
}


/* =====================================================
   SHOW APP
===================================================== */

function showApp() {

    document
        .getElementById("loginScreen")
        .style.display = "none";


    document
        .getElementById("app")
        .style.display = "block";


    updateInterface();
}


/* =====================================================
   UPDATE INTERFACE
===================================================== */

function updateInterface() {

    const account =
        accounts[currentAccount];


    if (!account) {
        return;
    }


    const role =
        currentAccount === "parent"
            ? "Parent"
            : "Child";


    const emoji =
        currentAccount === "parent"
            ? "👨‍👩‍👧"
            : "🧒";


    document
        .getElementById("welcomeTitle")
        .textContent =
        "Welcome, " + account.name + "!";


    document
        .getElementById("welcomeText")
        .textContent =
        "You are using the " +
        role +
        " account.";


    document
        .getElementById("sideName")
        .textContent =
        account.name;


    document
        .getElementById("sideRole")
        .textContent =
        role + " account";


    document
        .getElementById("largeAvatar")
        .textContent =
        emoji;


    updateSidebar();


    updatePage();
}


/* =====================================================
   UPDATE PAGE
===================================================== */

function updatePage() {

    const taskForm =
        document.getElementById(
            "parentTaskForm"
        );


    const pointsBox =
        document.getElementById(
            "pointsBox"
        );


    const tasksTitle =
        document.getElementById(
            "tasksTitle"
        );


    if (currentAccount === "parent") {

        taskForm.style.display =
            "block";


        pointsBox.style.display =
            "none";


        tasksTitle.textContent =
            "📋 All Tasks";


        updateChildSelect();

        displayParentTasks();

    } else {

        taskForm.style.display =
            "none";


        pointsBox.style.display =
            "flex";


        tasksTitle.textContent =
            "📋 Pending Tasks";


        document
            .getElementById("pointsNumber")
            .textContent =
            childPoints;


        displayChildTasks();
    }
}


/* =====================================================
   UPDATE CHILD SELECT
===================================================== */

function updateChildSelect() {

    const select =
        document.getElementById(
            "childSelect"
        );


    select.innerHTML = "";


    if (accounts.child) {

        const option =
            document.createElement("option");


        option.value =
            "child";


        option.textContent =
            accounts.child.name;


        select.appendChild(option);

    } else {

        const option =
            document.createElement("option");


        option.value = "";


        option.textContent =
            "No child account";


        select.appendChild(option);
    }
}


/* =====================================================
   ADD TASK
===================================================== */

function addTask() {

    const taskInput =
        document.getElementById(
            "taskInput"
        );


    const pointsInput =
        document.getElementById(
            "pointsInput"
        );


    const childSelect =
        document.getElementById(
            "childSelect"
        );


    const error =
        document.getElementById(
            "taskError"
        );


    const taskName =
        taskInput.value.trim();


    const points =
        Number(pointsInput.value);


    const child =
        childSelect.value;


    if (!taskName) {

        error.textContent =
            "Please enter a task.";

        return;
    }


    if (!points || points <= 0) {

        error.textContent =
            "Please enter valid points.";

        return;
    }


    if (!child) {

        error.textContent =
            "Please choose a child.";

        return;
    }


    const newTask = {

        id: Date.now(),

        name: taskName,

        points: points,

        child: child,

        completed: false

    };


    tasks.push(newTask);


    saveTasks();


    taskInput.value = "";

    pointsInput.value = "";

    error.textContent = "";


    displayParentTasks();
}


/* =====================================================
   DISPLAY PARENT TASKS
===================================================== */

function displayParentTasks() {

    const list =
        document.getElementById(
            "taskList"
        );


    list.innerHTML = "";


    if (tasks.length === 0) {

        list.innerHTML = `

            <div class="empty-box">

                <div class="empty-icon">
                    📝
                </div>

                <div>
                    No tasks yet.
                </div>

            </div>

        `;

        return;
    }


    tasks.forEach(function(task) {

        const card =
            document.createElement("div");


        card.className =
            "task-card";


        const childName =
            accounts.child
                ? accounts.child.name
                : "Child";


        card.innerHTML = `

            <div class="task-info">

                <div class="task-name">
                    ${escapeHTML(task.name)}
                </div>

                <div class="task-points">
                    ⭐ ${task.points} points
                </div>

                <div class="task-child">
                    🧒 For: ${escapeHTML(childName)}
                </div>

            </div>

            ${
                task.completed
                ? '<div class="completed-label">✅ Completed</div>'
                : '<div style="color:#facc15;">⏳ Pending</div>'
            }

        `;


        list.appendChild(card);

    });
}


/* =====================================================
   DISPLAY CHILD TASKS
===================================================== */

function displayChildTasks() {

    const list =
        document.getElementById(
            "taskList"
        );


    list.innerHTML = "";


    const pendingTasks =
        tasks.filter(function(task) {

            return (
                task.child === "child" &&
                !task.completed
            );

        });


    if (pendingTasks.length === 0) {

        list.innerHTML = `

            <div class="empty-box">

                <div class="empty-icon">
                    🎉
                </div>

                <div>
                    No pending tasks!
                </div>

                <div style="margin-top:8px;">
                    Great job!
                </div>

            </div>

        `;

        return;
    }


    pendingTasks.forEach(function(task) {

        const card =
            document.createElement("div");


        card.className =
            "task-card";


        card.innerHTML = `

            <div class="task-info">

                <div class="task-name">
                    ${escapeHTML(task.name)}
                </div>

                <div class="task-points">
                    ⭐ You can earn ${task.points} points
                </div>

            </div>

            <button
                class="complete-btn"
                onclick="completeTask(${task.id})">

                ✅ Complete

            </button>

        `;


        list.appendChild(card);

    });
}


/* =====================================================
   COMPLETE TASK
===================================================== */

function completeTask(taskId) {

    const task =
        tasks.find(function(item) {

            return item.id === taskId;

        });


    if (!task) {
        return;
    }


    if (task.completed) {
        return;
    }


    task.completed = true;


    childPoints +=
        Number(task.points);


    localStorage.setItem(
        "childPoints",
        childPoints
    );


    saveTasks();


    updatePage();
}


/* =====================================================
   SAVE TASKS
===================================================== */

function saveTasks() {

    localStorage.setItem(
        "goalTasks",
        JSON.stringify(tasks)
    );
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");


    div.textContent = text;


    return div.innerHTML;
}


/* =====================================================
   UPDATE SIDEBAR
===================================================== */

function updateSidebar() {

    const parentButton =
        document.getElementById(
            "parentAccountButton"
        );


    const childButton =
        document.getElementById(
            "childAccountButton"
        );


    const parentCheck =
        document.getElementById(
            "parentCheck"
        );


    const childCheck =
        document.getElementById(
            "childCheck"
        );


    parentButton
        .classList
        .remove("active");


    childButton
        .classList
        .remove("active");


    parentCheck.style.visibility =
        "hidden";


    childCheck.style.visibility =
        "hidden";


    if (accounts.parent) {

        document
            .getElementById("parentName")
            .textContent =
            accounts.parent.name;


        parentButton.style.display =
            "flex";

    } else {

        parentButton.style.display =
            "none";
    }


    if (accounts.child) {

        document
            .getElementById("childName")
            .textContent =
            accounts.child.name;


        childButton.style.display =
            "flex";

    } else {

        childButton.style.display =
            "none";
    }


    if (currentAccount === "parent") {

        parentButton
            .classList
            .add("active");


        parentCheck.style.visibility =
            "visible";
    }


    if (currentAccount === "child") {

        childButton
            .classList
            .add("active");


        childCheck.style.visibility =
            "visible";
    }
}


/* =====================================================
   SWITCH ACCOUNT
===================================================== */

function switchAccount(type) {

    if (!accounts[type]) {
        return;
    }


    /*
       CHILD → PARENT
       Parent password required.
    */

    if (
        type === "parent" &&
        currentAccount === "child"
    ) {

        const password =
            prompt(
                "Enter the Parent password:"
            );


        if (password === null) {
            return;
        }


        if (
            password !==
            accounts.parent.password
        ) {

            alert(
                "Incorrect Parent password."
            );

            return;
        }
    }


    /*
       PARENT → CHILD
       No password required.
    */


    currentAccount = type;


    localStorage.setItem(
        "currentAccount",
        currentAccount
    );


    updateInterface();


    closeSidebar();
}


/* =====================================================
   SIDEBAR
===================================================== */

function openSidebar() {

    document
        .getElementById("sidebar")
        .classList
        .add("open");


    document
        .getElementById("overlay")
        .classList
        .add("show");
}


function closeSidebar() {

    document
        .getElementById("sidebar")
        .classList
        .remove("open");


    document
        .getElementById("overlay")
        .classList
        .remove("show");
}


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

    currentAccount = null;


    localStorage.removeItem(
        "currentAccount"
    );


    document
        .getElementById("app")
        .style.display = "none";


    document
        .getElementById("loginScreen")
        .style.display = "flex";


    document
        .getElementById("nameInput")
        .value = "";


    document
        .getElementById("passwordInput")
        .value = "";


    document
        .getElementById("loginError")
        .textContent = "";


    selectAccount("parent");


    closeSidebar();
}


/* =====================================================
   START APP
===================================================== */

if (
    currentAccount &&
    accounts[currentAccount]
) {

    showApp();

} else {

    document
        .getElementById("loginScreen")
        .style.display =
        "flex";


    selectAccount("parent");
}

</script>

</body>
</html>
